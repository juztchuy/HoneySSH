[honeypot]
# Fake hostname shown in the shell prompt
hostname = ubuntu-srv

# Where session logs go (ttylog files)
log_path = var/log/cowrie

# Where attacker file downloads are stored
download_path = var/lib/cowrie/downloads

# TTY log directory (replayed with `cowrie playlog`)
ttylog_path = var/lib/cowrie/tty

# Enable TTY recording
ttylog = true

# State and data paths
state_path = var/lib/cowrie
etc_path = etc

# Timeouts (seconds)
authentication_timeout = 120
interactive_timeout = 300


[ssh]
enabled = true

# Port the honeypot listens on inside the container
listen_endpoints = tcp:2222:interface=0.0.0.0

# Host keys — generated by the Dockerfile
rsa_public_key  = etc/ssh_host_rsa_key.pub
rsa_private_key = etc/ssh_host_rsa_key
dsa_public_key  = etc/ssh_host_dsa_key.pub
dsa_private_key = etc/ssh_host_dsa_key

# Fake SSH banner (matches Ubuntu 22.04 default)
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

# Accept any password so every attacker gets a shell
auth_class = cowrie.core.auth.AuthRandom
auth_class_parameters = 1, 5, 10

# Disable SFTP (we're not running a real filesystem)
sftp_enabled = false

# Disable port forwarding
forwarding = false


[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0


[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json


[output_textlog]
enabled = true
logfile = var/log/cowrie/cowrie.log
